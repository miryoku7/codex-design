<!doctype html>
<html lang="ja" data-i18n-pending>
<head><style>html[data-i18n-pending] body{visibility:hidden}.i18n-boot{display:none}html[data-i18n-pending] .i18n-boot{visibility:visible;display:grid;position:fixed;inset:0;place-content:center;background:#fff;color:#282a31;font:500 14px system-ui}</style>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" data-i18n-content="save.colors.typography.spacing.and.examples.as">
  <title data-i18n="design.kits.design.library"></title>
  <link rel="stylesheet" href="/library.css">
  <link rel="stylesheet" href="/kits.css">
  <script src="/workbench/i18n.js" defer></script><script src="/workbench/preview.js" defer></script>
  <script src="/kit-zip.js" defer></script>
  <script src="/kits.js" defer></script>
</head>
<body inert aria-busy="true">
<div class="i18n-boot" aria-hidden="true">Codex Design</div>
  <a class="skip-link" href="#mainContent" data-i18n="skip.to.content"></a>
  <header class="site-header">
    <a class="brand" href="/" data-i18n-aria-label="design.library.home"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M3 5h7v14H3zM14 5h7v6h-7zM14 15h7v4h-7z" stroke="currentColor" stroke-width="1.5"/></svg><span data-i18n="design.library.2"></span></a>
    <nav class="site-nav" data-i18n-aria-label="library"><a href="/" data-i18n="projects"></a><a href="/kits" aria-current="page" data-i18n="design.kits"></a></nav>
  <label class="locale-switch"><span class="sr-only" data-i18n="language"></span><select data-locale-switch data-i18n-aria-label="language"><option value="ja" lang="ja">日本語</option><option value="en" lang="en">English</option></select></label></header>
  <main class="library kits-library" id="mainContent" tabindex="-1">
    <nav class="breadcrumb" id="kitBreadcrumb" hidden data-i18n-aria-label="current.location"><a href="/kits" data-i18n="design.kits"></a><span aria-hidden="true">/</span><span id="kitBreadcrumbCurrent" aria-current="page"></span></nav>
    <div class="library-heading"><div class="heading-copy"><h1 id="kitTitle" tabindex="-1" data-i18n="design.kits"></h1><p id="kitDescription" hidden></p></div><div class="heading-actions" id="kitActions"><button class="solid-button" id="createKit" type="button" data-i18n="create.kit"></button></div></div>
    <div class="library-notice" id="kitNotice" role="alert" hidden><p id="kitNoticeText"></p><button class="quiet-button" id="retryKit" type="button" data-i18n="reload"></button></div>
    <div class="loading-state" id="kitLoading" role="status" data-i18n="loading.design.kits"></div>
    <section id="kitsOverview" hidden data-i18n-aria-label="saved.kits"><ul class="kit-list" id="kitList"></ul><div class="empty-state" id="kitsEmpty" hidden><h2 data-i18n="no.kits.yet"></h2><p data-i18n="choose.a.design.and.direction.to.collect"></p><button class="quiet-button" id="emptyCreateKit" type="button" data-i18n="create.kit"></button></div></section>

    <section id="kitDetail" hidden>
      <div class="kit-version-bar"><label for="kitVersion"><span data-i18n="version.to.view"></span><select id="kitVersion"></select></label><p id="versionDate"></p><div class="version-actions"><button class="quiet-button" id="compareVersions" type="button" data-i18n="compare.versions"></button><button class="quiet-button" id="exportKit" type="button" data-i18n="save.this.version.as.zip"></button><button class="solid-button" id="editKit" type="button" data-i18n="create.a.new.version.from.this"></button></div></div>
      <p class="version-summary" id="versionSummary" hidden></p>
      <div class="kit-read-layout"><section class="kit-section"><h2 data-i18n="tokens"></h2><div class="token-catalog" id="tokenCatalog"></div></section><section class="kit-section"><h2 data-i18n="usage.and.layout.rules"></h2><div class="kit-guide" id="kitGuide"></div></section></div>
      <section class="kit-section examples-section"><div class="section-heading"><h2 data-i18n="examples.2"></h2><span id="exampleCount"></span></div><div class="kit-examples" id="kitExamples"></div></section>
    </section>

    <section id="kitCompare" hidden>
      <div class="compare-toolbar"><label class="form-field" for="compareBefore"><span data-i18n="before"></span><select id="compareBefore"></select></label><span class="compare-direction" aria-hidden="true">→</span><label class="form-field" for="compareAfter"><span data-i18n="after"></span><select id="compareAfter"></select></label><button class="quiet-button" id="closeCompare" type="button" data-i18n="back.to.kit"></button></div>
      <section class="kit-section"><h2 data-i18n="changes"></h2><div id="tokenChanges" class="token-changes"></div><div id="ruleChanges" class="rule-changes"></div></section>
      <section class="kit-section"><div class="section-heading"><h2 data-i18n="compare.the.same.example"></h2><label class="compare-example-label" for="compareExample"><span data-i18n="examples.2"></span><select id="compareExample"></select></label></div><p class="field-hint compare-hint" data-i18n="each.version.s.tokens.are.applied.to"></p><div class="compare-previews" id="comparePreviews"></div></section>
    </section>

    <section id="kitEditor" hidden>
      <section id="sourcePicker" class="kit-section source-picker"><div class="section-heading"><h2 data-i18n="source.designs.and.directions"></h2><span data-i18n="select.the.base.direction.first"></span></div>
        <div class="source-pick-row"><label class="form-field" for="sourceDesign"><span data-i18n="saved.design"></span><select id="sourceDesign"><option value="" data-i18n="select.a.design"></option></select></label><label class="form-field" for="sourceVariant"><span data-i18n="direction.2"></span><select id="sourceVariant" disabled><option value="" data-i18n="select.a.design.first"></option></select></label><button class="quiet-button" id="addSource" type="button" disabled data-i18n="add.to.examples"></button></div>
        <p class="field-hint" id="sourceHint" data-i18n="the.base.direction.s.declared.colors.typography"></p><div id="selectedSources" class="selected-sources"></div><div class="prepare-footer"><button class="quiet-button" id="cancelSources" type="button" data-i18n="cancel"></button><button class="solid-button" id="prepareKit" type="button" disabled data-i18n="prepare.draft.from.selection"></button></div>
      </section>
      <form id="kitForm" hidden>
        <div class="editor-intro" id="editorIntro"></div>
        <div class="kit-basics"><label class="form-field" for="kitName"><span data-i18n="kit.name"></span><input id="kitName" name="name" required maxlength="300" autocomplete="off" data-i18n-placeholder="example.reading.app.foundations"></label><label class="form-field" for="kitDraftDescription"><span><span data-i18n="description"></span><small data-i18n="optional"></small></span><input id="kitDraftDescription" name="description" maxlength="5000" autocomplete="off"></label></div>
        <section class="kit-section"><div class="section-heading"><h2 data-i18n="tokens"></h2><button class="quiet-button" id="addToken" type="button" data-i18n="add.token"></button></div><p class="field-hint token-editor-hint" data-i18n="names.are.css.variables.without.the.leading"></p><div class="token-editor" id="tokenEditor"></div></section>
        <section class="kit-section"><label class="form-field" for="kitRules"><span class="field-heading" data-i18n="usage.and.layout.rules"></span><textarea id="kitRules" name="rules" rows="7" maxlength="50000" data-i18n-placeholder="example.use.24px.base.spacing.reserve.the"></textarea></label></section>
        <section class="kit-section"><div class="section-heading"><h2 data-i18n="examples.2"></h2><button class="quiet-button" id="refreshDraftPreviews" type="button" data-i18n="preview.entered.tokens"></button></div><div class="kit-examples" id="draftExamples"></div></section>
        <label class="form-field summary-field" id="summaryField" for="kitChangeSummary" hidden><span><span data-i18n="notes.for.this.version"></span><small data-i18n="optional"></small></span><input id="kitChangeSummary" maxlength="1000" autocomplete="off" data-i18n-placeholder="example.adjusted.accent.and.body.text.size"></label>
        <div class="form-message" id="kitFormError" role="alert" hidden></div><div class="kit-conflict" id="kitConflict" hidden><h2 data-i18n="currently.saved.version"></h2><div id="kitConflictCurrent"></div><div class="token-catalog" id="kitConflictTokens"></div><div class="kit-guide" id="kitConflictRules"></div><a id="kitConflictLink" target="_blank" rel="noopener" data-i18n="open.the.current.version.in.another.tab"></a></div>
        <div class="editor-footer"><p id="kitSaveHint" data-i18n="saving.creates.v1"></p><div><button class="quiet-button" id="cancelEditor" type="button" data-i18n="cancel"></button><button class="solid-button" id="saveKit" type="submit" data-i18n="save.v1"></button></div></div>
      </form>
      <div class="form-message" id="sourceError" role="alert" hidden></div>
    </section>
    <p class="sr-only" id="kitStatus" role="status" aria-live="polite"></p>
  </main>
  <dialog class="library-dialog kit-preview-dialog" id="previewDialog" aria-labelledby="previewDialogTitle"><div class="dialog-heading"><h2 id="previewDialogTitle" data-i18n="examples.2"></h2><button class="icon-button" id="closePreview" type="button" data-i18n-aria-label="close.preview">×</button></div><div id="largePreview"></div><label class="locale-switch"><span class="sr-only" data-i18n="language"></span><select data-locale-switch data-i18n-aria-label="language"><option value="ja" lang="ja">日本語</option><option value="en" lang="en">English</option></select></label></dialog>
</body>
</html>
