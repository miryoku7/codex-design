<!doctype html>
<html lang="ja" data-i18n-pending>
<head><style>html[data-i18n-pending] body{visibility:hidden}.i18n-boot{display:none}html[data-i18n-pending] .i18n-boot{visibility:visible;display:grid;position:fixed;inset:0;place-content:center;background:#fff;color:#282a31;font:500 14px system-ui}</style><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" data-i18n-content="a.local.workspace.for.comparing.and.refining"><title>Design Workbench</title><link rel="stylesheet" href="styles.css"><script src="i18n.js" defer></script><script src="preview.js" defer></script><script src="app.js" defer></script></head>
<body inert aria-busy="true">
<div class="i18n-boot" aria-hidden="true">Codex Design</div>
<header class="topbar"><a class="library-back" id="libraryBack" href="/" hidden><svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true"><path d="m11.5 5-5 5 5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="libraryBackLabel" data-i18n="library"></span></a><a class="brand" href="/" aria-label="Design Workbench"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M3 5h7v14H3zM14 5h7v6h-7zM14 15h7v4h-7z" stroke="currentColor" stroke-width="1.5"/></svg><span>Design Workbench</span></a><div class="save-cluster" id="saveCluster"><span class="save-dot" aria-hidden="true"></span><span id="saveStatus" role="status" aria-live="polite" data-i18n="loading"></span><button class="text-button" id="retrySave" type="button" hidden data-i18n="retry"></button></div><div class="top-actions"><button class="button" id="exportPdf" type="button">PDF</button><button class="button" id="exportJson" type="button">JSON</button><button class="button" id="exportHandoff" type="button" disabled data-i18n="export.handoff"></button></div><label class="locale-switch"><span class="sr-only" data-i18n="language"></span><select data-locale-switch data-i18n-aria-label="language"><option value="ja" lang="ja">日本語</option><option value="en" lang="en">English</option></select></label></header>
<div class="conflict-banner" id="conflictBanner" role="alert" hidden><div><strong data-i18n="saving.is.paused"></strong><p id="conflictMessage"></p></div><div class="conflict-actions"><button class="button" id="keepDraft" type="button" data-i18n="save.draft.again"></button><button class="button" id="useServer" type="button" data-i18n="load.server.version"></button></div></div>
<main>
<section class="project-bar" aria-labelledby="projectTitle"><div class="project-copy"><div class="project-context"><span id="sampleLabel" hidden data-i18n="sample.project"></span><span id="projectContext" data-i18n="design.comparison"></span></div><h1 id="projectTitle" data-i18n="loading.design"></h1><p id="briefSummary"></p></div><div class="project-actions"><span class="adoption-status" id="adoptionStatus" data-i18n="no.direction.adopted"></span><button class="button" id="editBrief" type="button" data-i18n="edit.brief"></button></div></section>
<div class="workspace-toolbar"><nav class="view-nav" id="viewNav" data-i18n-aria-label="direction.to.view"><button type="button" class="view-button active" data-view="compare" data-focus="view-compare" aria-pressed="true" data-i18n="compare.3.directions"></button><span id="variantTabs"></span></nav><div class="viewport-tools"><label class="preset-field"><span class="sr-only" data-i18n="device"></span><select id="viewportPreset"><option value="mobile" data-i18n="phone"></option><option value="tablet" data-i18n="tablet"></option><option value="desktop" data-i18n="desktop"></option><option value="custom" data-i18n="custom"></option></select></label><div class="viewport-size"><input type="number" id="viewportWidth" min="240" max="2560" step="1" data-i18n-aria-label="viewport.width.px"><span>×</span><input type="number" id="viewportHeight" min="320" max="2160" step="1" data-i18n-aria-label="viewport.height.px"></div><button type="button" class="zoom-button" id="zoomMode" data-i18n-title="toggle.fit.to.screen.actual.size" data-i18n="fit.to.screen"></button></div></div>
<div class="workspace" id="workspace" data-mode="compare"><section class="stage" data-i18n-aria-label="design.preview"><div id="variantGrid" class="variant-grid" aria-busy="true"></div><p class="stage-caption" id="stageCaption" data-i18n="comparing.at.the.same.screen.size.open"></p></section><aside class="inspector" id="inspector" aria-labelledby="inspectorTitle" hidden><div class="inspector-heading"><span class="inspector-context" id="inspectorContext" data-i18n="viewing.and.adjusting"></span><h2 id="inspectorTitle"></h2><p id="selectedRationale"></p></div><form id="inspectorForm"><div id="tweakControls"></div><details class="base-controls" id="baseControls"><summary data-i18n="base.colors.and.sizes"></summary><div id="tokenControls"></div></details><label class="note-field"><span data-i18n="notes.for.this.direction.2"></span><textarea id="notesInput" rows="3" data-i18n-placeholder="for.example.keep.the.heading.and.tighten"></textarea></label><p class="note-hint" data-i18n="ask.codex.to.apply.these.notes.in"></p><button class="text-button reset-button" id="resetVariant" type="button" data-i18n="reset.adjustments"></button></form><div class="adopt-area"><button class="button adopt-button" id="adoptVariant" type="button" data-i18n="adopt.this.direction"></button><button class="text-button" id="clearAdoption" type="button" hidden data-i18n="undo.adoption"></button><p id="adoptHint" data-i18n="viewing.or.adjusting.does.not.adopt.a"></p></div><div class="screen-exports"><button class="text-button" id="exportHtml" type="button" data-i18n="screen.html"></button><button class="text-button" id="exportCss" type="button">CSS</button></div></aside></div>
</main>
<dialog id="briefDialog" class="brief-dialog" aria-labelledby="briefTitle"><div class="dialog-heading"><div><span class="dialog-context" data-i18n="design.starting.point"></span><h2 id="briefTitle" data-i18n="edit.the.brief"></h2></div><button class="close-button" type="button" id="closeBrief" data-i18n-aria-label="close.brief">×</button></div><p class="dialog-intro" data-i18n="keep.the.decisions.from.your.first.conversation"></p><form id="briefForm" class="brief-form"><label><span id="briefPurposeLabel" data-i18n="purpose.of.this.screen"></span><textarea data-brief="purpose" rows="2"></textarea></label><div class="brief-pair"><label><span data-i18n="audience"></span><input data-brief="audience" type="text"></label><label><span data-i18n="device.and.context"></span><input data-brief="platform" type="text"></label></div><label><span data-i18n="desired.feel"></span><textarea data-brief="mood" rows="2"></textarea></label><label><span data-i18n="things.to.avoid"></span><textarea data-brief="avoid" rows="2"></textarea></label></form><div class="dialog-footer"><p id="briefSaveHint" data-i18n="your.input.is.saved.automatically.to.the.2"></p><button class="button dark-button" type="button" id="doneBrief" data-i18n="back.to.comparison"></button></div><label class="locale-switch"><span class="sr-only" data-i18n="language"></span><select data-locale-switch data-i18n-aria-label="language"><option value="ja" lang="ja">日本語</option><option value="en" lang="en">English</option></select></label></dialog>
<dialog id="pdfDialog" class="brief-dialog" aria-labelledby="pdfTitle"><div class="dialog-heading"><h2 id="pdfTitle" data-i18n="export.as.pdf"></h2><button class="close-button" id="closePdf" type="button" data-i18n-aria-label="close.pdf.export">×</button></div><p class="dialog-intro" data-i18n="open.the.print.view.then.choose.save"></p><div class="pdf-options"><button class="button" id="exportPdfCurrent" type="button" data-i18n="current.direction.2"></button><button class="button" id="exportPdfAll" type="button" data-i18n="compare.all.directions"></button></div><p class="note-hint" data-i18n="each.direction.fits.one.page.long.screens"></p><p id="pdfStatus" role="status" aria-live="polite"></p><label class="locale-switch"><span class="sr-only" data-i18n="language"></span><select data-locale-switch data-i18n-aria-label="language"><option value="ja" lang="ja">日本語</option><option value="en" lang="en">English</option></select></label></dialog>
</body></html>
